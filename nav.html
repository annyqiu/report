<style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:0 0 50px;color:#3B2F14;min-height:100vh;background:linear-gradient(180deg,#3A2A0D 0%,#755617 130px,#B8912F 220px,#E4D3A0 310px,#F4EDD9 390px,#FCFAF4 100%)}
.container{max-width:1000px;margin:0 auto;padding:48px 28px 0}
h1{font-size:34px;color:#fff;margin:0 0 10px;font-weight:800;letter-spacing:.5px;text-shadow:0 3px 16px rgba(30,20,0,.4);display:flex;align-items:center;gap:14px}
h1::before{content:"";width:9px;height:34px;border-radius:5px;background:linear-gradient(180deg,#F5DFA0,#D4A017);box-shadow:0 0 18px rgba(245,223,160,.75)}
.subtitle{color:rgba(255,250,235,.88);font-size:14px;margin:0 0 32px;letter-spacing:.3px}
.subtitle[style]{color:#4A3612;font-size:15px;font-weight:800;margin:34px 0 14px!important;display:flex;align-items:center;gap:10px;letter-spacing:0}
.subtitle[style]::before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(180deg,#C9971B,#F0D78A)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.grid a{position:relative;display:flex;align-items:center;justify-content:center;padding:16px 12px;background:#fff;border:1px solid #EFE7D3;border-radius:11px;text-decoration:none;color:#4A3C1E;font-size:14.5px;font-weight:600;box-shadow:0 3px 10px rgba(90,66,20,.05);transition:all .2s ease;overflow:hidden}
.grid a::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#C9971B,#E8CD93);opacity:0;transition:opacity .2s ease}
.grid a:hover{transform:translateY(-3px);border-color:#E2C87C;color:#8A6410;box-shadow:0 12px 24px rgba(180,140,40,.18)}
.grid a:hover::before{opacity:1}
.list{display:flex;flex-direction:column;gap:9px}
.list a:not([class]){display:flex;align-items:center;padding:15px 20px;background:#fff;border:1px solid #EFE7D3;border-radius:10px;text-decoration:none;color:#4A3C1E;font-size:14px;font-weight:600;box-shadow:0 3px 10px rgba(90,66,20,.05);transition:all .2s ease}
.list a:not([class]):hover{transform:translateX(4px);border-color:#E2C87C;color:#8A6410;box-shadow:0 6px 16px rgba(180,140,40,.14)}
.arrow{color:#B09A6E;margin-left:auto;font-size:14px}
.list a.featured{display:flex;align-items:center;padding:18px 22px;border-radius:12px;text-decoration:none;color:#fff;font-size:15.5px;font-weight:700;background:linear-gradient(120deg,#7A5410,#D4A017);box-shadow:0 6px 18px rgba(150,105,15,.3);transition:transform .2s ease,box-shadow .2s ease}
.list a.featured:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(150,105,15,.42)}
.list a.featured .arrow{color:rgba(255,250,235,.9);margin-left:auto}
.list a.featured-alt{display:flex;align-items:center;padding:18px 22px;border-radius:12px;text-decoration:none;color:#fff;font-size:15.5px;font-weight:700;background:linear-gradient(120deg,#6B4E14,#B8912F);box-shadow:0 6px 18px rgba(107,78,20,.28);transition:transform .2s ease,box-shadow .2s ease}
.list a.featured-alt:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(107,78,20,.4)}
.list a.featured-alt .arrow{color:rgba(255,250,235,.9);margin-left:auto}
.list a.featured-alt2{display:flex;align-items:center;padding:18px 22px;border-radius:12px;text-decoration:none;color:#fff;font-size:15.5px;font-weight:700;background:linear-gradient(120deg,#8A6E28,#E0C36A);box-shadow:0 6px 18px rgba(138,110,40,.26);transition:transform .2s ease,box-shadow .2s ease}
.list a.featured-alt2:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(138,110,40,.38)}
.list a.featured-alt2 .arrow{color:rgba(255,250,235,.9);margin-left:auto}
.fsub{display:block;font-size:11.5px;font-weight:500;color:rgba(255,250,235,.82);margin-top:4px;line-height:1.5}
.footer{text-align:center;color:#A89870;font-size:11.5px;margin-top:38px;padding-top:18px;border-top:1px solid #E8DDBE}
@media(max-width:640px){body{background:linear-gradient(180deg,#3A2A0D 0%,#755617 110px,#B8912F 180px,#E4D3A0 260px,#F4EDD9 330px)}.container{padding:30px 16px 0}h1{font-size:26px}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}</style>
