<style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:0 0 50px;color:#1e293b;min-height:100vh;background:linear-gradient(180deg,#0f172a 0%,#1e3a8a 130px,#2563eb 220px,#dbeafe 310px,#f1f5f9 390px,#f8fafc 100%)}
.container{max-width:1000px;margin:0 auto;padding:48px 28px 0}
h1{font-size:34px;color:#fff;margin:0 0 10px;font-weight:800;letter-spacing:.5px;text-shadow:0 3px 16px rgba(15,23,42,.25);display:flex;align-items:center;gap:14px}
h1::before{content:"";width:9px;height:34px;border-radius:5px;background:linear-gradient(180deg,#93c5fd,#fff);box-shadow:0 0 18px rgba(147,197,253,.75)}
.subtitle{color:rgba(255,255,255,.88);font-size:14px;margin:0 0 32px;letter-spacing:.3px}
.subtitle[style]{color:#1e293b;font-size:15px;font-weight:800;margin:34px 0 14px!important;display:flex;align-items:center;gap:10px;letter-spacing:0}
.subtitle[style]::before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(180deg,#2563eb,#60a5fa)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.grid a{position:relative;display:flex;align-items:center;justify-content:center;padding:16px 12px;background:#fff;border:1px solid #e8edf5;border-radius:11px;text-decoration:none;color:#334155;font-size:14.5px;font-weight:600;box-shadow:0 3px 10px rgba(15,23,42,.04);transition:all .2s ease;overflow:hidden}
.grid a::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#3b82f6,#8b5cf6);opacity:0;transition:opacity .2s ease}
.grid a:hover{transform:translateY(-3px);border-color:#bfdbfe;color:#1d4ed8;box-shadow:0 12px 24px rgba(37,99,235,.13)}
.grid a:hover::before{opacity:1}
.list{display:flex;flex-direction:column;gap:9px}
.list a:not([class]){display:flex;align-items:center;padding:15px 20px;background:#fff;border:1px solid #e8edf5;border-radius:10px;text-decoration:none;color:#334155;font-size:14px;font-weight:600;box-shadow:0 3px 10px rgba(15,23,42,.04);transition:all .2s ease}
.list a:not([class]):hover{transform:translateX(4px);border-color:#bfdbfe;color:#1d4ed8;box-shadow:0 6px 16px rgba(37,99,235,.1)}
.arrow{color:#94a3b8;margin-left:auto;font-size:14px}
.list a.featured{display:flex;align-items:center;padding:18px 22px;border-radius:12px;text-decoration:none;color:#fff;font-size:15.5px;font-weight:700;background:linear-gradient(120deg,#B3272F,#E4572E);box-shadow:0 6px 18px rgba(179,39,47,.28);transition:transform .2s ease,box-shadow .2s ease}
.list a.featured:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(179,39,47,.38)}
.list a.featured .arrow{color:rgba(255,255,255,.9);margin-left:auto}
.list a.featured-alt{display:flex;align-items:center;padding:18px 22px;border-radius:12px;text-decoration:none;color:#fff;font-size:15.5px;font-weight:700;background:linear-gradient(120deg,#1E3A8A,#3B6FD4);box-shadow:0 6px 18px rgba(30,58,138,.28);transition:transform .2s ease,box-shadow .2s ease}
.list a.featured-alt:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(30,58,138,.38)}
.list a.featured-alt .arrow{color:rgba(255,255,255,.9);margin-left:auto}
.list a.featured-alt2{display:flex;align-items:center;padding:18px 22px;border-radius:12px;text-decoration:none;color:#fff;font-size:15.5px;font-weight:700;background:linear-gradient(120deg,#6D28D9,#A855F7);box-shadow:0 6px 18px rgba(109,40,217,.26);transition:transform .2s ease,box-shadow .2s ease}
.list a.featured-alt2:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(109,40,217,.36)}
.list a.featured-alt2 .arrow{color:rgba(255,255,255,.9);margin-left:auto}
.fsub{display:block;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.8);margin-top:4px;line-height:1.5}
.footer{text-align:center;color:#94a3b8;font-size:11.5px;margin-top:38px;padding-top:18px;border-top:1px solid #e2e8f0}
@media(max-width:640px){body{background:linear-gradient(180deg,#0f172a 0%,#1e3a8a 110px,#2563eb 180px,#dbeafe 260px,#f1f5f9 330px)}.container{padding:30px 16px 0}h1{font-size:26px}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}</style>
