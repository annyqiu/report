<style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:0;color:#2b2b2b;background:#fafafa}
.container{max-width:1000px;margin:0 auto;padding:40px 28px 60px}
h1{font-size:26px;color:#222;margin:0 0 6px;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:4px;height:24px;border-radius:2px;background:#c8a54a}
.subtitle{color:#999;font-size:13px;margin:0 0 26px}
.subtitle[style]{color:#333;font-size:14px;font-weight:600;margin:30px 0 12px!important;display:flex;align-items:center;gap:8px}
.subtitle[style]::before{content:"";width:3px;height:14px;border-radius:2px;background:#c8a54a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.grid a{display:flex;align-items:center;justify-content:center;padding:13px 10px;background:#fff;border:1px solid #ececec;border-radius:8px;text-decoration:none;color:#444;font-size:13.5px;font-weight:500;transition:border-color .15s,background .15s,color .15s}
.grid a:hover{border-color:#c8a54a;background:#fffdf6;color:#8a6d20}
.list{display:flex;flex-direction:column;gap:8px}
.list a:not([class]){display:flex;align-items:center;padding:13px 18px;background:#fff;border:1px solid #ececec;border-radius:8px;text-decoration:none;color:#444;font-size:13.5px;font-weight:500;transition:border-color .15s,background .15s,color .15s}
.list a:not([class]):hover{border-color:#c8a54a;background:#fffdf6;color:#8a6d20}
.arrow{color:#bbb;margin-left:auto;font-size:13px}
.list a.featured{display:flex;align-items:center;padding:14px 18px;border-radius:8px;text-decoration:none;color:#8a6d20;font-size:14px;font-weight:600;background:#fdf9ec;border:1px solid #ece0bd;transition:background .15s,border-color .15s}
.list a.featured:hover{background:#fbf3dc;border-color:#c8a54a}
.list a.featured .arrow{color:#b79a55;margin-left:auto}
.list a.featured-alt{display:flex;align-items:center;padding:14px 18px;border-radius:8px;text-decoration:none;color:#5b6b8a;font-size:14px;font-weight:600;background:#f6f8fc;border:1px solid #e1e7f0;transition:background .15s,border-color .15s}
.list a.featured-alt:hover{background:#eef2f9;border-color:#9db0d0}
.list a.featured-alt .arrow{color:#a3aec2;margin-left:auto}
.list a.featured-alt2{display:flex;align-items:center;padding:14px 18px;border-radius:8px;text-decoration:none;color:#6b8a72;font-size:14px;font-weight:600;background:#f5f9f6;border:1px solid #dfeae1;transition:background .15s,border-color .15s}
.list a.featured-alt2:hover{background:#edf5ef;border-color:#a3c4aa}
.list a.featured-alt2 .arrow{color:#a6bfa9;margin-left:auto}
.fsub{display:block;font-size:11px;font-weight:400;color:#999;margin-top:3px;line-height:1.5}
.footer{text-align:center;color:#bbb;font-size:11px;margin-top:30px;padding-top:16px;border-top:1px solid #eee}
@media(max-width:640px){.container{padding:28px 16px 40px}h1{font-size:22px}.grid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr))}}</style>
</head>
