<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>艾珀莎护肤·报告中心</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:0 0 56px;color:#3B2F14;min-height:100vh;background:linear-gradient(180deg,#4A3612 0%,#8A6A1D 150px,#D9C48A 240px,#F4EDD9 330px,#FCFAF4 100%)}

.section:nth-child(n+6){--accent:#8F7A4E;--accent2:#CDBE96}

.section::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

a:hover::before{opacity:1;box-shadow:0 0 0 4px rgba(212,160,23,.16)}
